<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Login - EcoCycle E-Waste Management</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <!-- Core Styles -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-wrapper">

    <div class="auth-card">
        <!-- Header -->
        <div class="auth-header">
            <span class="auth-badge"><i class="fas fa-user"></i> Citizen Portal</span>
            <h2>Welcome Back</h2>
            <p>Login to schedule pickups & track your green impact</p>
        </div>

        <!-- Body -->
        <div class="auth-body">
            <!-- Role Switch Tabs -->
            <div class="auth-tabs">
                <a href="/loginpage" class="auth-tab-item active"><i class="fas fa-user"></i> User</a>
                <a href="/e" class="auth-tab-item"><i class="fas fa-building"></i> Corporate</a>
                <a href="/loginpagesell" class="auth-tab-item"><i class="fas fa-store"></i> Seller</a>
            </div>

            <!-- Alerts -->
            <div th:if="${error}" class="alert-custom-error">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${error}"></span>
            </div>

            <!-- Form -->
            <form th:action="@{/login}" method="post">
                <div class="form-group-custom">
                    <label>Username</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" name="username" placeholder="Enter your username" required autofocus>
                    </div>
                </div>

                <div class="form-group-custom">
                    <label>Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="btn-eco-primary w-100 mt-3" style="padding: 14px; font-size: 1rem;">
                    <i class="fas fa-sign-in-alt"></i> Sign In to Account
                </button>
            </form>

            <div class="text-center mt-4 pt-2 border-top">
                <p class="text-muted small mb-2">Don't have an account yet?</p>
                <a href="/register" class="btn-eco-outline w-100" style="padding: 10px; font-size: 0.9rem;">
                    <i class="fas fa-user-plus"></i> Create Citizen Account
                </a>
            </div>

            <div class="text-center mt-3">
                <a href="/" class="text-muted small text-decoration-none">
                    <i class="fas fa-arrow-left"></i> Back to Homepage
                </a>
            </div>
        </div>
    </div>

</body>
</html>
